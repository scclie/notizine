    <ctx :loop="$site.asset('.cache/slots.json').ziggy().get('footer')">
      <div class="slot-row"><ctx :loop="$loop.it">
        <ctx :if="$loop.it.get('module').eql('_breadcrumbs').or($loop.it.get('module').eql('_prev_next')).or($loop.it.get('module').eql('_header')).or($loop.it.get('module').eql('_footer_text')).or($loop.it.get('module').eql('_recents')).or($loop.it.get('module').eql('_lang_nav')).or($loop.it.get('module').eql('_theme_toggle')).or($loop.it.get('module').eql('_spacer')).or($loop.it.get('module').eql('_explorer')).or($loop.it.get('module').eql('_content')).not()">
          <ctx name="$loop.it.get('module')">
            <ctx align="$loop.it.get('align')">
              <div class="$ctx.align" :html="$site.asset($ctx.name.prefix('.cache/modules/').suffix('.html')).bytes()"></div>
            </ctx>
          </ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_header')">
          <ctx a="$loop.it.get('align')">
            <div class="$ctx.a">          <a href="$site.index().link()" class="site-title" :text="$site.title"></a>            </div></ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_footer_text')">
          <ctx a="$loop.it.get('align')"><div class="$ctx.a"><p class="footer-text"><span :text="$i18n.get('generated_by')"></span> <a href="https://zine-ssg.io">Zine</a> <span :text="$i18n.get('with')"></span> <a href="https://notizine.sccl.cc">notizine</a></p></div></ctx>
        </ctx>
            <ctx :if="$loop.it.get('module').eql('_recents')">
              <ctx a="$loop.it.get('align')">
                <div class="$ctx.a">              <div class="module module-recents"><a href="$site.page('recents').link()"><h3 :text="$i18n.get('recents_title')"></h3></a><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><ctx lk2="$loop.it.link().eql('/').then('index', $loop.it.link())">
  <ctx meta2="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk2)">
    <ctx :if="$ctx.meta2.get?('recent_meta')">
      <div class="recent-meta" :text="$ctx.meta2.get('recent_meta')"></div>
    </ctx>
  </ctx>
</ctx><div class="recent-footer"><div class="recent-footer-top"><a href="$site.page('recents').link()" class="see-more" :text="$i18n.get('see_more')"></a><a href="$site.page('recents').link()" class="random-note" :text="$i18n.get('random_note')"></a></div><ctx :if="$page.link().eql('/recents/').or($page.link().eql('/tags/')).or($page.link().eql('/search/')).or($page.link().eql('/explorer/')).or($page.isSection()).not()"><div class="recent-footer-bottom"><ctx :if="$page.prevPage?()"><a href="$if.link()" class="recent-nav-prev" :text="$i18n.get('prev_short')"></a></ctx><span class="flex-spacer"></span><ctx :if="$page.nextPage?()"><a href="$if.link()" class="recent-nav-next" :text="$i18n.get('next_short')"></a></ctx></div></ctx></div><script>(function(){var s=document.currentScript;var e=s.parentElement.querySelector('.random-note');if(e){var u=[<ctx :loop="$site.page($ctx.sec).leaves(999)">'$loop.it.link()',</ctx>];e.addEventListener('click',function(ev){ev.preventDefault();location.href=u[Math.floor(Math.random()*u.length)]})}})()</script></div></ctx></div>                </div>
              </ctx>
            </ctx>
        <ctx :if="$loop.it.get('module').eql('_lang_nav')">
          <ctx a="$loop.it.get('align')">
            <div class="$ctx.a">          <ctx :if="$page.locales().len.gt(2)"><nav class="lang-nav"><select onchange="location=this.value"><ctx :loop="$page.locales()"><option value="$loop.it.link()" :text="$loop.it.site().localeCode()"></option></ctx></select></nav></ctx>
          <ctx :if="$page.locales().len.eq(2)"><nav class="lang-nav"><ctx :loop="$page.locales()"><a href="$loop.it.link()" :text="$loop.it.site().localeCode()"></a></ctx></nav></ctx>            </div></ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_theme_toggle')">
          <ctx a="$loop.it.get('align')">
            <div class="$ctx.a">          <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('darkmode')"><div class="theme-toggle"><input type="checkbox" id="theme-dark" onchange="localStorage.setItem('notizine-theme',this.checked?'dark':'light');document.documentElement.setAttribute('data-theme',this.checked?'dark':'')"><label for="theme-dark" title="Toggle theme"></label></div></ctx>            </div></ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_spacer')">
          <span class="flex-spacer"></span>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_explorer')">
  <ctx sec="$loop.it.get('section')">
          <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('explorer')">
            <ul class="explorer-tree">
              <li :loop="$site.page($ctx.sec).subpages()">
<ctx :if="$loop.it.link().endsWith('tags/').or($loop.it.link().endsWith('search/')).or($loop.it.link().endsWith('recents/')).or($loop.it.link().endsWith('explorer/')).not()">
                <ctx :if="$loop.it.isSection()">
                  <details><summary><a href="$loop.it.link()" :text="$loop.it.title"></a></summary>
                    <ctx :if="$loop.it.leaves().len.gt(0)"><ul><li :loop="$loop.it.leaves()"><a href="$loop.it.link()" :text="$loop.it.title"></a></li></ul></ctx>
                  </details>
                </ctx>
                <ctx :if="$loop.it.isSection().not()"><a href="$loop.it.link()" :text="$loop.it.title"></a></ctx>
              </ctx>
              
              </li>
            </ul>
  </ctx>
          </ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_content')">
          <div class="page-content" :html="$page.content()"></div>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_breadcrumbs')">
          <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('breadcrumbs')">
            <ctx :if="$page.isSection().not()">
              <nav class="breadcrumbs"><a href="$site.index().link()" :text="$i18n.get('home')"></a><span> / </span><ctx :if="$page.parentSection().link().eql('/').not()"><a href="$page.parentSection().link()" :text="$page.parentSection().title"></a><span> / </span></ctx><span :text="$page.title"></span></nav>
            </ctx>
          </ctx>
        </ctx>
        <ctx :if="$loop.it.get('module').eql('_prev_next')">
          <ctx :if="$page.isSection().not()">
            <ctx :if="$page.hasPrev().or($page.hasNext())">
              <nav class="prev-next"><ctx :if="$page.prevPage?()"><a href="$if.link()" :text="$i18n.get('previous_page').suffix(': ').suffix($if.title)"></a></ctx><ctx :if="$page.nextPage?()"><a href="$if.link()" :text="$i18n.get('next_page').suffix(': ').suffix($if.title)"></a></ctx></nav>
            </ctx>
          </ctx>
        </ctx>
      </ctx></div>
    </ctx>
  </footer>
</body>
</html>
