<!DOCTYPE html>
<html lang="$site.localeCode()">
<head id="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <title :text="$page.title.suffix(' · ').suffix($site.title)"></title>
  <meta name="description" content="$page.description">
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode')">
    <style :html="$site.asset('.cache/all.css').bytes()"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode').not()">
    <link rel="stylesheet" href="$site.asset('css/generated.css').link()">
  </ctx>
  <script :html="$site.asset('js/theme.js').bytes()"></script>
  <ctx lk="$page.link().eql('/').then('index', $page.link())">
    <ctx :if="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get?('css')">
      <style :html="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get('css')"></style>
    </ctx>
    <ctx :if="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get?('js')">
      <script :html="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get('js')"></script>
    </ctx>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').prefix(':root{--font-body:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').prefix(':root{--font-heading:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').prefix(':root{--font-code:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('google_fonts').len().gt(0)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="$site.asset('notizine.ziggy').ziggy().get('google_fonts').prefix('https://fonts.googleapis.com/css2?family=').suffix('&display=swap')">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('custom_css').len().gt(0)">
    <style :html="$site.asset($site.asset('notizine.ziggy').ziggy().get('custom_css')).bytes()"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('og_images')">
    <meta property="og:title" content="$page.title">
    <meta property="og:description" content="$page.description">
    <meta property="og:url" content="$site.host_url.addPath($page.link())">
    <meta property="og:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
    <meta property="og:image:alt" content="$page.title">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$page.title">
    <meta name="twitter:description" content="$page.description">
    <meta name="twitter:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
  </ctx>
  <super>
</head>
<body id="body">
  <div class="layout">
    <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
      <aside class="zone zone-left" id="zone-left" :if="$ctx.zm.get('left').len.gt(0)">
        <ctx :loop="$ctx.zm.get('left')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </aside>
    </ctx>
    <div class="zone zone-center" id="zone-center">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <header id="header">
          <ctx :loop="$ctx.zm.get('header')">
            <ctx :if="$loop.it.len.gt(0)">
              <div class="slot-row"><ctx :loop="$loop.it">
                <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
              </ctx></div>
            </ctx>
          </ctx>
        </header>
        <ctx :loop="$ctx.zm.get('before_main')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
      <main id="content">
        <super>
        <div class="page-content" :html="$page.content()"></div>
        <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
          <ctx :loop="$ctx.zm.get('center')">
            <ctx :if="$loop.it.len.gt(0)">
              <div class="slot-row"><ctx :loop="$loop.it">
                <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
              </ctx></div>
            </ctx>
          </ctx>
        </ctx>
      </main>
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('after_main')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <footer id="footer" :if="$ctx.zm.get('footer').len.gt(0)">
          <ctx :loop="$ctx.zm.get('footer')">
            <ctx :if="$loop.it.len.gt(0)">
              <div class="slot-row"><ctx :loop="$loop.it">
                <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
              </ctx></div>
            </ctx>
          </ctx>
        </footer>
      </ctx>
    </div>
    <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
      <aside class="zone zone-right" id="zone-right" :if="$ctx.zm.get('right').len.gt(0)">
        <ctx :loop="$ctx.zm.get('right')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </aside>
    </ctx>
  </div>
  <script defer src="$site.asset('.cache/search.js').link()"></script>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode')">
    <script :html="$site.asset('.cache/all.js').bytes()"></script>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode').not()">
    <script defer src="$site.asset('.cache/all.js').link()"></script>
  </ctx>
</body>
</html>
