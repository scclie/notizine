<!DOCTYPE html>
<html lang="$site.localeCode()">
<head id="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <title :text="$page.title.suffix(' · ').suffix($site.title)"></title>
  <meta name="description" content="$page.description">
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode')">
    <style :html="$site.asset('css/notizine.css').bytes()"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode').not()">
    <link rel="stylesheet" href="$site.asset('css/notizine.css').link()">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('google_fonts').len().gt(0)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="$site.asset('notizine.ziggy').ziggy().get('google_fonts').prefix('https://fonts.googleapis.com/css2?family=').suffix('&display=swap')">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').prefix(':root{--font-body:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').prefix(':root{--font-heading:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').prefix(':root{--font-code:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('custom_css').len().gt(0)">
    <style :html="$site.asset($site.asset('notizine.ziggy').ziggy().get('custom_css')).bytes()"></style>
  </ctx>
  <ctx alt="$site.page('posts').alternative('rss')" :if="$site.asset('notizine.ziggy').ziggy().get('features').get('rss')">
    <link rel="alternate" type="application/rss+xml" href="$ctx.alt.link()">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('og_images')">
    <meta property="og:title" content="$page.title">
    <meta property="og:description" content="$page.description">
    <meta property="og:url" content="$site.host_url.addPath($page.link())">
    <meta property="og:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
    <meta property="og:image:alt" content="$page.title">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$page.title">
    <meta name="twitter:description" content="$page.description">
    <meta name="twitter:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
  </ctx>
<ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1).eql('720px').not()">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1).prefix(':root{--col-center:').suffix(';--max-width:').suffix($site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1)).suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(0).len().gt(0).and($site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(0).eql('hide').not())">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(0).prefix(':root{--max-width:none;--left-display:block;--col-side:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).len().gt(0).and($site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).eql('hide').not())">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).prefix(':root{--max-width:none;--col-side:').suffix('}')"></style>
  </ctx>
<ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1).eql('720px').not()">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1).prefix(':root{--col-center:').suffix(';--max-width:').suffix($site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(1)).suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('gap').eql('1.5rem').not()">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('gap').prefix(':root{--col-gap:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).len().gt(0).and($site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).eql('hide').not())">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('layout').get('columns').at(2).prefix(':root{--layout-display:grid;--right-display:block;--col-right:').suffix(';--max-width:none}')"></style>
  </ctx>
  <super>
</head>
<body id="body">
  <div class="layout">
<ctx :if="$site.asset('notizine.ziggy').ziggy().get('slots').get('left').len.gt(0)">
    <aside class="zone zone-left" id="zone-left">
      <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('left')">
        <div class="slot-row"><ctx :loop="$loop.it">
            <ctx :if="$loop.it.startsWith('modules/')">
              <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
              </div>
            </ctx>
          </ctx>
        </div>
      </ctx>
    </aside>
  </ctx>
    <div class="zone zone-center" id="zone-center">
      <header id="header">
      <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('center_before')">
        <div class="slot-row">
          <ctx :loop="$loop.it">
            <ctx :if="$loop.it.splitN(':', 0).eql('_header').and($loop.it.endsWith(':center').not()).and($loop.it.endsWith(':right').not())">
              <a href="$site.index().link()" class="site-title" :text="$site.title"></a>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_header').and($loop.it.endsWith(':center'))">
              <div style="display:flex;justify-content:center;width:100%">
                <a href="$site.index().link()" class="site-title" :text="$site.title"></a>
              </div>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_header').and($loop.it.endsWith(':right'))">
              <div style="display:flex;justify-content:flex-end;width:100%">
                <a href="$site.index().link()" class="site-title" :text="$site.title"></a>
              </div>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_lang_nav')">
              <ctx :if="$page.locales().len.gt(2)">
                <nav class="lang-nav"><select onchange="location=this.value"><ctx :loop="$page.locales()"><option value="$loop.it.link()" :text="$loop.it.site().localeCode()"></option></ctx></select></nav>
              </ctx>
              <ctx :if="$page.locales().len.eq(2)">
                <nav class="lang-nav"><ctx :loop="$page.locales()"><a href="$loop.it.link()" :text="$loop.it.site().localeCode()"></a></ctx></nav>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_theme_toggle')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('darkmode')">
                <div class="theme-toggle"><input type="checkbox" id="theme-dark" onchange="localStorage.setItem('notizine-theme',this.checked?'dark':'light')"><label for="theme-dark" title="Toggle theme"></label></div>
                <script>(function(){var t=localStorage.getItem('notizine-theme');if(t==='dark')document.getElementById('theme-dark').checked=true;else if(!t&&matchMedia('(prefers-color-scheme:dark)').matches)document.getElementById('theme-dark').checked=true})()</script>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_spacer')">
              <span class="flex-spacer"></span>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_breadcrumbs')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('breadcrumbs')">
                <ctx :if="$page.isSection().not()">
                  <ctx :if="$page.parentSection().link().eql($site.index().link()).not()">
                    <nav class="breadcrumbs"><a href="$site.index().link()" :text="$i18n.get('home')"></a><span> / </span><a href="$page.parentSection().link()" :text="$page.parentSection().title"></a><span> / </span><span :text="$page.title"></span></nav>
                  </ctx>
                </ctx>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_spacer')">
              <span class="flex-spacer"></span>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
              </div>
            </ctx>
            <ctx :if="$loop.it.startsWith('modules/')">
              <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
            </ctx>
          </ctx>
        </div>
      </ctx>
      </header>
      <ctx :if="$site.asset('notizine.ziggy').ziggy().get('slots').get('center_pre').len.gt(0)">
      <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('center_pre')">
        <div class="slot-row">
          <ctx :loop="$loop.it">
            <ctx :if="$loop.it.splitN(':', 0).eql('_breadcrumbs')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('breadcrumbs')">
                <ctx :if="$page.isSection().not()">
                  <ctx :if="$page.parentSection().link().eql($site.index().link()).not()">
                    <nav class="breadcrumbs"><a href="$site.index().link()" :text="$i18n.get('home')"></a><span> / </span><a href="$page.parentSection().link()" :text="$page.parentSection().title"></a><span> / </span><span :text="$page.title"></span></nav>
                  </ctx>
                </ctx>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
              </div>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_spacer')">
              <span class="flex-spacer"></span>
            </ctx>
            <ctx :if="$loop.it.startsWith('modules/')">
              <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
            </ctx>
          </ctx>
        </div>
      </ctx>
      </ctx>
      <main id="content">
        <super>
      </main>
      <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('center_after')">
        <div class="slot-row"><ctx :loop="$loop.it">
            <ctx :if="$loop.it.splitN(':', 0).eql('_prev_next')">
              <ctx :if="$page.hasPrev().or($page.hasNext())">
                <nav class="prev-next"><ctx :if="$page.prevPage?()"><a href="$if.link()" :text="$i18n.get('previous_page').suffix(': ').suffix($if.title)"></a></ctx><ctx :if="$page.nextPage?()"><a href="$if.link()" :text="$i18n.get('next_page').suffix(': ').suffix($if.title)"></a></ctx></nav>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
              </div>
            </ctx>
            <ctx :if="$loop.it.startsWith('modules/')">
              <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
            </ctx>
          </ctx>
        </div>
      </ctx>
    </div>
    <ctx :if="$site.asset('notizine.ziggy').ziggy().get('slots').get('right').len.gt(0)">
    <aside class="zone zone-right" id="zone-right">
      <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('right')">
        <div class="slot-row"><ctx :loop="$loop.it">
            <ctx :if="$loop.it.startsWith('modules/')">
              <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
                <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
              </div>
            </ctx>
          </ctx>
        </div>
      </ctx>
    </aside>
  </ctx>
  </div>
  <footer id="footer">
    <ctx :loop="$site.asset('notizine.ziggy').ziggy().get('slots').get('footer')">
      <div class="slot-row"><ctx :loop="$loop.it">
          <ctx :if="$loop.it.splitN(':', 0).eql('_footer_text').and($loop.it.endsWith(':center').not()).and($loop.it.endsWith(':right').not())">
            <p class="footer-text">
              <span :text="$i18n.get('generated_by')"></span>
              <a href="https://zine-ssg.io">Zine</a>
              <span :text="$i18n.get('with')"></span>
              <a href="https://notizine.sccl.cc">notizine</a>
            </p>
          </ctx>
          <ctx :if="$loop.it.splitN(':', 0).eql('_footer_text').and($loop.it.endsWith(':center'))">
            <div style="text-align:center;width:100%">
              <p class="footer-text">
                <span :text="$i18n.get('generated_by')"></span>
                <a href="https://zine-ssg.io">Zine</a>
                <span :text="$i18n.get('with')"></span>
                <a href="https://notizine.sccl.cc">notizine</a>
              </p>
            </div>
          </ctx>
          <ctx :if="$loop.it.splitN(':', 0).eql('_footer_text').and($loop.it.endsWith(':right'))">
            <div style="text-align:right;width:100%">
              <p class="footer-text">
                <span :text="$i18n.get('generated_by')"></span>
                <a href="https://zine-ssg.io">Zine</a>
                <span :text="$i18n.get('with')"></span>
                <a href="https://notizine.sccl.cc">notizine</a>
              </p>
            </div>
          </ctx>
          <ctx :if="$loop.it.splitN(':', 0).eql('_back_to_top')">
            <a href="$site.index().link()" :text="$i18n.get('back_to_top')"></a>
          </ctx>
          <ctx :if="$loop.it.splitN(':', 0).eql('_rss_link')">
            <ctx alt="$site.page('posts').alternative('rss')" :if="$site.asset('notizine.ziggy').ziggy().get('features').get('rss')"><a href="$ctx.alt.link()" class="rss-link">RSS</a></ctx>
          </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_recents')">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('recents')">
                <div class="module module-recents" style="$loop.it.endsWith(':right').then('margin-left:auto', $loop.it.endsWith(':center').then('margin-left:auto;margin-right:auto', ''))"><h3 :text="$i18n.get('recents_title')"></h3><ctx :loop="$site.index().leaves(5)"><div class="recent-item"><a href="$loop.it.link()" :text="$loop.it.title"></a><time :text="$loop.it.date.format('2006-01-02')"></time></div></ctx></div>
              </ctx>
            </ctx>
            <ctx :if="$loop.it.splitN(':', 0).eql('_social')">
              <div class="module module-social">
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('github').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('github').prefix('https://github.com/')" class="social-link">GitHub</a></ctx>
              <ctx :if="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon').len().gt(0)"><a :href="$site.asset('notizine.ziggy').ziggy().get('social').get('mastodon')" rel="me" class="social-link">Mastodon</a></ctx>
            </div>
          </ctx>
          <ctx :if="$loop.it.startsWith('modules/').and($loop.it.endsWith(':center'))">
            <div style="display:flex;justify-content:center;width:100%"><div class="slot" :html="$site.asset($loop.it.splitN(':', 0)).bytes()"></div></div>
          </ctx>
          <ctx :if="$loop.it.startsWith('modules/').and($loop.it.endsWith(':right'))">
            <div style="display:flex;justify-content:flex-end;width:100%"><div class="slot" :html="$site.asset($loop.it.splitN(':', 0)).bytes()"></div></div>
          </ctx>
          <ctx :if="$loop.it.startsWith('modules/').and($loop.it.contains(':').not())">
            <div class="slot" :html="$site.asset($loop.it).bytes()"></div>
          </ctx>
        </ctx>
      </div>
    </ctx>
  </footer>
</body>
</html>
