<!DOCTYPE html>
<!-- notizine-performance:critical-shell:start -->
<html lang="$site.localeCode()">
<head id="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <title :text="$page.title.suffix(' · ').suffix($site.title)"></title>
  <meta name="description" content="$page.description">
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode')">
    <style :html="$site.asset('.cache/all.css').bytes()"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('inline_mode').not()">
    <link rel="stylesheet" href="$site.asset('css/generated.css').link()">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('darkmode')">
    <script :html="$site.asset('js/theme.js').bytes()"></script>
  </ctx>
  <ctx ma="$site.asset('.cache/page-assets.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
    <ctx :loop="$ctx.ma.get('localAssets')"><ctx asset="$site.asset($loop.it).link()"></ctx></ctx>
    <ctx :html="$ctx.ma.get('criticalStyles')"></ctx>
    <ctx :html="$ctx.ma.get('criticalScripts')"></ctx>
    <ctx :html="$ctx.ma.get('deferredStyles')"></ctx>
    <ctx :html="$ctx.ma.get('externalStyles')"></ctx>
  </ctx>
  <ctx lk="$page.link().eql('/').then('index', $page.link())">
    <ctx :if="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get?('css')">
      <style :html="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get('css')"></style>
    </ctx>
    <ctx :if="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get?('js')">
      <script :html="$site.asset('.cache/per-page-assets.json').ziggy().get($ctx.lk).get('js')"></script>
    </ctx>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('body').prefix(':root{--font-body:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('heading').prefix(':root{--font-heading:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').len().gt(0)">
    <style :html="$site.asset('notizine.ziggy').ziggy().get('fonts').get('code').prefix(':root{--font-code:').suffix('}')"></style>
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('google_fonts').len().gt(0)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="$site.asset('notizine.ziggy').ziggy().get('google_fonts').prefix('https://fonts.googleapis.com/css2?family=').suffix('&display=swap')">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('rss')">
    <link rel="alternate" type="application/rss+xml" :title="$site.page('posts').title.suffix(' · RSS')" :href="$site.page('posts').link().suffix('index.xml')">
  </ctx>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('og_images')">
    <meta property="og:title" content="$page.title">
    <meta property="og:description" content="$page.description">
    <meta property="og:url" content="$site.host_url.addPath($page.link())">
    <meta property="og:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
    <meta property="og:image:alt" content="$page.title">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$page.title">
    <meta name="twitter:description" content="$page.description">
    <meta name="twitter:image" content="$site.host_url.addPath($page.link()).suffix('og.png')">
  </ctx>
  <super>
</head>
<body id="body">
  <div class="layout">
    <div class="grid-cell grid-cell-top-left">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('top_left')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </div>
    <header class="grid-cell grid-cell-top-center" id="header">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('top_center')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </header>
    <div class="grid-cell grid-cell-top-right">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('top_right')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </div>
    <aside class="grid-cell grid-cell-middle-left">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('middle_left')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </aside>
    <main class="grid-cell grid-cell-middle-center" id="content">
      <!-- notizine-performance:page-body:start -->
      <super>
      <div class="page-content" :html="$page.content()"></div>
      <!-- notizine-performance:page-body:end -->
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('middle_center')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </main>
    <aside class="grid-cell grid-cell-middle-right">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('middle_right')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </aside>
    <div class="grid-cell grid-cell-bottom-left">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('bottom_left')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </div>
    <footer class="grid-cell grid-cell-bottom-center" id="footer">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('bottom_center')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </footer>
    <div class="grid-cell grid-cell-bottom-right">
      <ctx pk="$page.link().eql('/').then('/index/', $page.link())" zm="$site.asset('.cache/zones-manifest.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
        <ctx :loop="$ctx.zm.get('bottom_right')">
          <ctx :if="$loop.it.len.gt(0)">
            <div class="slot-row"><ctx :loop="$loop.it">
              <div class="$loop.it.get('align').prefix('align-')" :html="$site.asset($ctx.pk.prefix('.cache/zones').suffix($loop.it.get('file'))).bytes()"></div>
            </ctx></div>
          </ctx>
        </ctx>
      </ctx>
    </div>
  </div>
  <ctx :if="$site.asset('notizine.ziggy').ziggy().get('features').get('search')">
    <script defer src="$site.asset('.cache/search.js').link()"></script>
  </ctx>
  <ctx ma="$site.asset('.cache/page-assets.json').ziggy().get($page.link().eql('/').then('index', $page.link()))">
    <ctx :html="$ctx.ma.get('deferredScripts')"></ctx>
    <ctx :html="$ctx.ma.get('externalScripts')"></ctx>
  </ctx>
</body>
</html>
<!-- notizine-performance:critical-shell:end -->
