<!DOCTYPE html>
<html lang="$site.localeCode()">
<head id="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title :text="$page.title.suffix(' · ').suffix($site.title)"></title>
  <meta name="description" content="$page.description">
  <link rel="stylesheet" href="$site.asset('css/notizine.css').link()">
  <ctx alt="$site.page('posts').alternative('rss')" :if="$site.asset('notizine.json').ziggy().get('features').get('rss')">
    <link rel="alternate" type="application/rss+xml" href="$ctx.alt.link()">
  </ctx>
  <super>
</head>
<body id="body">
  <header id="header">
    <a href="$site.index().link()" :text="$site.title"></a>
    <ctx :if="$page.locales().len.gt(2)">
      <nav>
        <select onchange="location=this.value">
          <ctx :loop="$page.locales()">
            <option value="$loop.it.link()" :text="$loop.it.site().localeCode()"></option>
          </ctx>
        </select>
      </nav>
    </ctx>
    <ctx :if="$page.locales().len.eq(2)">
      <nav>
        <ctx :loop="$page.locales()">
          <a href="$loop.it.link()" :text="$loop.it.site().localeCode()"></a>
        </ctx>
      </nav>
    </ctx>
  </header>
  <main id="content">
    <ctx :if="$site.asset('notizine.json').ziggy().get('features').get('breadcrumbs')">
      <ctx :if="$page.isSection().not()">
        <ctx :if="$page.parentSection().link().eql($site.index().link()).not()">
          <nav class="breadcrumbs">
            <a href="$site.index().link()" :text="$i18n.get('home')"></a>
            <span> / </span>
            <a href="$page.parentSection().link()" :text="$page.parentSection().title"></a>
            <span> / </span>
            <span :text="$page.title"></span>
          </nav>
        </ctx>
      </ctx>
    </ctx>
    <super>
  </main>
  <footer id="footer">
    <a href="$site.index().link()" :text="$i18n.get('back_to_top')"></a>
    <ctx alt="$site.page('posts').alternative('rss')" :if="$site.asset('notizine.json').ziggy().get('features').get('rss')">
      <a href="$ctx.alt.link()" class="rss-link">RSS</a>
    </ctx>
    <p>
      <span :text="$i18n.get('generated_by')"></span>
      <a href="https://zine-ssg.io">Zine</a>
      <span :text="$i18n.get('with')"></span>
      <a href="https://notizine.sccl.cc">notizine</a>
    </p>
  </footer>
  <script :if="$site.asset('notizine.json').ziggy().get('features').get('darkmode')">
    (function(){var e=localStorage.getItem("notizine-theme");if(e){document.documentElement.setAttribute("data-theme",e)}else if(window.matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.setAttribute("data-theme","dark")}})()
  </script>
</body>
</html>
