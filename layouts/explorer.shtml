<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="website">
</head>
<main id="content">
  <div class="page-content">
    <h1 :text="$page.title"></h1>
    <ul>
      <ctx :loop="$site.index().subpages()">
        <li>
          <ctx :if="$loop.it.isSection()">
            <details open>
              <summary><a href="$loop.it.link()" :text="$loop.it.title"></a></summary>
              <ctx :if="$loop.it.leaves().len.gt(0)">
                <ul>
                  <ctx :loop="$loop.it.leaves()">
                    <li><a href="$loop.it.link()" :text="$loop.it.title"></a></li>
                  </ctx>
                </ul>
              </ctx>
            </details>
          </ctx>
          <ctx :if="$loop.it.isSection().not()">
            <a href="$loop.it.link()" :text="$loop.it.title"></a>
          </ctx>
        </li>
      </ctx>
    </ul>
  </div>
</main>
