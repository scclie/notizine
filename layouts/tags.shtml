<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="website">
</head>
<main id="content">
  <h1 :text="$page.title"></h1>
  <ctx :loop="$site.index().leaves()">
    <ctx :if="$loop.it.tags.len.gt(0)">
      <article>
        <a href="$loop.it.link()" :text="$loop.it.title"></a>
        <ctx :loop="$loop.it.tags">
          <a class="tag" href="$site.page('tags').link().suffix('?tag=').suffix($loop.it)" :text="$loop.it"></a>
        </ctx>
      </article>
    </ctx>
  </ctx>
  <script>
    (function(){var t=new URLSearchParams(location.search).get("tag");if(t){document.querySelectorAll("article").forEach(function(a){var m=Array.from(a.querySelectorAll(".tag")).some(function(e){return e.textContent===t});a.style.display=m?"":"none"})}})()
  </script>
</main>
