<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="article">
</head>
<main id="content">
  <article>
    <header>
      <h1 :text="$page.title"></h1>
      <time :text="$page.date.format('2006-01-02')"></time>
    </header>
    <aside :if="$page.custom.get?('auto_translated')">
      <p :text="$i18n.get('translation_notice')"></p>
    </aside>
    <div :html="$page.content()"></div>
    <ctx :if="$page.tags.len.gt(0)">
      <ctx :loop="$page.tags">
        <span class="tag" :text="$loop.it"></span>
      </ctx>
    </ctx>
    <ctx :if="$page.hasPrev().or($page.hasNext())">
      <nav>
        <ctx :if="$page.prevPage?()">
          <a href="$if.link()" :text="$i18n.get('previous_page').suffix(': ').suffix($if.title)"></a>
        </ctx>
        <ctx :if="$page.nextPage?()">
          <a href="$if.link()" :text="$i18n.get('next_page').suffix(': ').suffix($if.title)"></a>
        </ctx>
      </nav>
    </ctx>
  </article>
</main>
