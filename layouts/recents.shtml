<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="website">
</head>
<main id="content">
  <h1 :text="$page.title"></h1>
  <ctx :loop="$site.index().leaves(50)">
    <article>
      <h2><a href="$loop.it.link()" :text="$loop.it.title"></a></h2>
      <time :text="$loop.it.date.format('2006-01-02')"></time>
      <ctx :if="$loop.it.description.len().gt(0)">
        <p :text="$loop.it.description"></p>
      </ctx>
      <ctx :if="$loop.it.tags.len.gt(0)">
        <ctx :loop="$loop.it.tags">
          <span class="tag" :text="$loop.it"></span>
        </ctx>
      </ctx>
    </article>
  </ctx>
</main>
