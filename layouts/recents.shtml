<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="website">
</head>
<main id="content">
  <div class="page-content">
    <h1 :text="$page.title"></h1>
    <ctx :loop="$site.page('posts').leaves(50)">
      <article>
        <a class="recent-row recent-row-block" href="$loop.it.link()">
          <div class="recent-row-head">
            <h2 :text="$loop.it.title"></h2>
            <time :text="$loop.it.date.format('2006-01-02')"></time>
          </div>
          <p :text="$loop.it.description"></p>
        </a>
        <ctx :if="$loop.it.tags.len.gt(0)">
          <div class="recent-row-tags">
            <ctx :loop="$loop.it.tags">
              <a class="tag" href="$site.page('tags').link().suffix('?tag=').suffix($loop.it)" :text="$loop.it"></a>
            </ctx>
          </div>
        </ctx>
      </article>
    </ctx>
  </div>
</main>
